<!DOCTYPE html>
<html>
    <head>
        <title>Login</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>

    <body>
        <div class="mainContainer">
            <div class="langSelectorContainer">
                <i class="fa-solid fa-language"></i>
                <select class="langSelectElement">
                    <option>English</option>
                    <option>日本語</option>
                    <option>Español</option>
                    <option>Tagalog</option>
                </select>
            </div>
            <div class="childContainer">
                <form action="POST">
                    <h2 id="loginHeader">Login</h2>
                    <div class="inputCon emailField">
                    <input type="email" placeholder=" " class="email field" required>
                    <label class="label">Email</label>
                    </div>
                    <div class="inputCon passField">
                    <input type="password" placeholder=" " id="password" class="password field" required>
                    <label class="label">Password</label>
                    <p id="showPasswordbtn">Show</p>
                    </div>
                    <a id="forgotpass" href="#">Forgot Password?</a>
                    <button class="loginBtn" href="#">Login</button>
                    <p id="singUpthingymajig">No account? <a id="signUpLink" href="#" style="font-weight: bold;">Sign up</a></p>
                </form>
                <div class="separator">
                    <hr>
                    <span>or</span>
                    <hr>
                </div>
                <div class="altMethods">
                    <div class="google" id="google">Google</div>
                    <div class="twitter-X" id="twitter-Eks">X</div>
                    <div class="facebook" id="facebook">Facebook</div>
                </div>
            </div>
            <div class="conNoAccWrap">
                <a type="button" class="contNoAcc" id="proceed-no-acc" href="homepage.html">Continue without an account</a>
            </div>
        </div>
    </body>
    <script src="fuctions.js"></script>
</html>
